name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore CarShop.sln

      - name: Build
        run: dotnet build CarShop.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CarShop.sln --no-build --configuration Release --verbosity normal